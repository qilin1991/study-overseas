name: gen-audio

on:
  schedule:
    - cron: '0 2,14 * * *'      # 每天 2 次（北京 10:00 / 22:00）
  workflow_dispatch: {}

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r audio/requirements.txt
      - name: Generate audio + upload to COS
        env:
          COS_SECRET_ID:  ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET:     qilin-1449368663
          COS_REGION:     ap-nanjing
          NEWS_SRC:       news_overseas.json
          TTS_LIMIT:      '10'
          TTS_VOICE:      en-GB-RyanNeural
        run: python audio/gen_audio.py
