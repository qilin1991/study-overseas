name: probe-engines
on:
  workflow_dispatch: {}
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Probe all free engines
        run: |
          python - <<'PY'
          import requests, json, time
          UA={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'}
          Q='The quick brown fox jumps over the lazy dog.'
          tests = [
            ('google-gtx',  'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+Q.replace(' ','+')),
            ('google-at',   'https://translate.googleapis.com/translate_a/single?client=at&sl=en&tl=zh-CN&dt=t&q='+Q.replace(' ','+')),
            ('google-webapp','https://translate.googleapis.com/translate_a/single?client=webapp&sl=en&tl=zh-CN&dt=t&q='+Q.replace(' ','+')),
            ('google-com',  'https://translate.google.com/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+Q.replace(' ','+')),
            ('google-cn',   'https://translate.google.cn/translate_a/single?client=gtx&sl=en&tl=zh-CN&dt=t&q='+Q.replace(' ','+')),
            ('mymemory',    'https://api.mymemory.translated.net/get?q='+Q.replace(' ','%20')+'&langpair=en|zh-CN'),
            ('lingva',      'https://lingva.ml/api/v1/en/zh/'+Q.replace(' ','%20')),
            ('libre',       'https://translate.astian.org/translate'),
          ]
          for n,u in tests:
            try:
              r=requests.get(u, headers=UA, timeout=15)
              print('%-16s HTTP %s  %s' % (n, r.status_code, r.text[:160].replace(chr(10),' ')))
            except Exception as e:
              print('%-16s ERR %s' % (n, str(e)[:100]))
            time.sleep(1)
          PY
