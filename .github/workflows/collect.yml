name: collect-overseas

on:
  schedule:
    - cron: '30 0,12 * * *'
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install requests trafilatura feedparser
      - name: Run collector
        run: python collect_overseas.py
      - name: Commit result
        run: |
          git config user.name  "study-collector-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news_overseas.json
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "collect: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
